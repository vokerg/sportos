name: Oracle Build and Publish or Deploy
on:
  workflow_dispatch:
    inputs:
      deploy:
        description: Deploy API/web to the configured Oracle host after publishing
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: sportos-oracle-operations
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 45
    permissions:
      contents: read
      packages: write
    outputs:
      web: ${{ steps.images.outputs.web }}
      api: ${{ steps.images.outputs.api }}
      worker: ${{ steps.images.outputs.worker }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Validate deployment orchestration
        run: node --test deploy/oracle/control.test.mjs
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and publish exact commit (ARM64)
        id: images
        shell: bash
        run: |
          set -euo pipefail
          for service in web api worker; do
            tag="ghcr.io/vokerg/sportos-$service:$GITHUB_SHA"
            if docker buildx imagetools inspect "$tag" >/dev/null 2>&1; then
              echo "Tag already published: $tag. Use Rollback to deploy it; refusing overwrite." >&2
              exit 1
            fi
          done
          for service in web api worker; do
            repository="ghcr.io/vokerg/sportos-$service"
            docker buildx build --platform linux/arm64 --target "$service" \
              --tag "$repository:$GITHUB_SHA" --push \
              --cache-from type=gha --cache-to type=gha,mode=max \
              --metadata-file "$RUNNER_TEMP/$service.json" .
            digest=$(jq -r '."containerimage.digest"' "$RUNNER_TEMP/$service.json")
            [[ $digest =~ ^sha256:[0-9a-f]{64}$ ]]
            echo "$service=$repository@$digest" >> "$GITHUB_OUTPUT"
          done
      - name: Smoke test published ARM64 runtime images without production data
        run: |
          docker run --rm --entrypoint node '${{ steps.images.outputs.api }}' -e "Promise.all([import('@sportos/db'),import('@sportos/importers'),import('@nestjs/core')])"
          docker run --rm --entrypoint node '${{ steps.images.outputs.worker }}' -e "Promise.all([import('@sportos/db'),import('@sportos/importers')])"
          # nginx resolves the API upstream at startup; use an isolated test network.
          docker network create sportos-smoke
          trap 'docker rm -f sportos-smoke-web sportos-smoke-api 2>/dev/null || true; docker network rm sportos-smoke 2>/dev/null || true' EXIT
          docker run -d --name sportos-smoke-api --network sportos-smoke --network-alias api --entrypoint node '${{ steps.images.outputs.api }}' -e "require('http').createServer((q,s)=>s.end('api-ok')).listen(3010,'0.0.0.0')"
          docker run -d --name sportos-smoke-web --network sportos-smoke '${{ steps.images.outputs.web }}'
          for ((attempt=1; attempt<=30; attempt++)); do
            if docker exec sportos-smoke-web wget -qO- http://127.0.0.1:8080/health; then break; fi
            sleep 1
          done
          docker exec sportos-smoke-web wget -qO- http://127.0.0.1:8080/ | grep -q '<app-root'
          docker exec sportos-smoke-web wget -qO- http://127.0.0.1:8080/api/health | grep -q api-ok
  deploy:
    if: inputs.deploy
    needs: build
    runs-on: ubuntu-latest
    environment: oracle
    timeout-minutes: 20
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@v4
      - name: Deploy published digests (worker remains blocked)
        env:
          ORACLE_HOST: ${{ secrets.ORACLE_HOST }}
          ORACLE_USER: ${{ secrets.ORACLE_USER }}
          ORACLE_SSH_KEY: ${{ secrets.ORACLE_SSH_KEY }}
          ORACLE_SSH_HOST_KEY: ${{ secrets.ORACLE_SSH_HOST_KEY }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GHCR_USER: ${{ github.actor }}
          RELEASE_SHA: ${{ github.sha }}
          WEB_IMAGE: ${{ needs.build.outputs.web }}
          API_IMAGE: ${{ needs.build.outputs.api }}
          WORKER_IMAGE: ${{ needs.build.outputs.worker }}
        run: bash deploy/oracle/ssh-operation.sh deploy
