name: issue-7-validation

on:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      CI: true
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.12.0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck web package
        run: pnpm --filter @sportos/web typecheck

      - name: Test web package
        run: pnpm --filter @sportos/web test

      - name: Build web package
        run: pnpm --filter @sportos/web build

      - name: Install Chromium evidence runner
        run: |
          pnpm add -Dw playwright@1.54.1
          pnpm exec playwright install chromium

      - name: Capture reconciliation screenshots
        run: |
          mkdir -p evidence
          pnpm --filter @sportos/web start > /tmp/sportos-web.log 2>&1 &
          for attempt in $(seq 1 90); do
            if curl --fail --silent http://127.0.0.1:4200 > /dev/null; then
              break
            fi
            sleep 1
          done
          if ! curl --fail --silent http://127.0.0.1:4200 > /dev/null; then
            cat /tmp/sportos-web.log
            exit 1
          fi
          node .github/evidence/issue-7-score-reconciliation.mjs

      - name: Upload reconciliation screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: daily-log-reconciliation-screenshots
          path: evidence/*.png
          if-no-files-found: error
