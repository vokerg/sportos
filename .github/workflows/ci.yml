name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CI: true
      SPORTOS_FLYWAY_URL: ${{ secrets.SPORTOS_CI_FLYWAY_URL }}
      SPORTOS_FLYWAY_USER: ${{ secrets.SPORTOS_CI_FLYWAY_USER }}
      SPORTOS_FLYWAY_PASSWORD: ${{ secrets.SPORTOS_CI_FLYWAY_PASSWORD }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.12.0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Fast Angular architecture guardrails
        run: pnpm check:web-architecture

      - name: GCP worker deployment checks (no cloud access)
        run: node --test deploy/gcp/*.test.mjs

      - name: Local development recovery checks
        run: pnpm test:dev-recovery

      - name: Performance operator restart and rate-limit checks
        run: node --test scripts/performance-catchup-runner.test.mjs

      - name: Check database integration configuration
        id: database_config
        env:
          FLYWAY_URL: ${{ secrets.SPORTOS_CI_FLYWAY_URL }}
          FLYWAY_USER: ${{ secrets.SPORTOS_CI_FLYWAY_USER }}
          FLYWAY_PASSWORD: ${{ secrets.SPORTOS_CI_FLYWAY_PASSWORD }}
          UPGRADE_FLYWAY_URL: ${{ secrets.SPORTOS_CI_UPGRADE_FLYWAY_URL }}
          UPGRADE_FLYWAY_USER: ${{ secrets.SPORTOS_CI_UPGRADE_FLYWAY_USER }}
          UPGRADE_FLYWAY_PASSWORD: ${{ secrets.SPORTOS_CI_UPGRADE_FLYWAY_PASSWORD }}
          UPGRADE_DATABASE_URL: ${{ secrets.SPORTOS_CI_UPGRADE_DATABASE_URL }}
          LEGACY_DATABASE_URL: ${{ secrets.SPORTOS_CI_LEGACY_DATABASE_URL }}
          APP_DATABASE_URL: ${{ secrets.SPORTOS_CI_APP_DATABASE_URL }}
          WORKER_DATABASE_URL: ${{ secrets.SPORTOS_CI_WORKER_DATABASE_URL }}
          WORKER_DATA_DATABASE_URL: ${{ secrets.SPORTOS_CI_WORKER_DATA_DATABASE_URL }}
        run: |
          missing=()
          for variable in \
            FLYWAY_URL \
            FLYWAY_USER \
            FLYWAY_PASSWORD \
            UPGRADE_FLYWAY_URL \
            UPGRADE_FLYWAY_USER \
            UPGRADE_FLYWAY_PASSWORD \
            UPGRADE_DATABASE_URL \
            LEGACY_DATABASE_URL \
            APP_DATABASE_URL \
            WORKER_DATABASE_URL \
            WORKER_DATA_DATABASE_URL; do
            if [ -z "${!variable}" ]; then
              missing+=("$variable")
            fi
          done

          if [ "${#missing[@]}" -gt 0 ]; then
            echo "ready=false" >> "$GITHUB_OUTPUT"
            {
              echo "### Database validation not configured"
              echo
              echo "Static validation will continue. Neon migration and database integration steps are skipped because these CI secret values are missing:"
              printf -- '- `%s`\n' "${missing[@]}"
            } >> "$GITHUB_STEP_SUMMARY"
            echo "::warning::Neon database validation skipped; missing CI secret values: ${missing[*]}"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
            echo "Neon database validation is configured."
          fi

      - name: Install Neon migration tools
        if: steps.database_config.outputs.ready == 'true'
        env:
          FLYWAY_VERSION: 10.20.1
        run: |
          sudo apt-get update
          sudo apt-get install --yes postgresql-client
          curl --fail --silent --show-error --location \
            "https://repo1.maven.org/maven2/org/flywaydb/flyway-commandline/${FLYWAY_VERSION}/flyway-commandline-${FLYWAY_VERSION}-linux-x64.tar.gz" \
            --output "$RUNNER_TEMP/flyway.tar.gz"
          tar --extract --gzip --file "$RUNNER_TEMP/flyway.tar.gz" --directory "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/flyway-${FLYWAY_VERSION}" >> "$GITHUB_PATH"

      - name: Migrate fresh Neon test branch
        if: steps.database_config.outputs.ready == 'true'
        run: pnpm db:migrate

      - name: Verify populated V105 ownership upgrade
        if: steps.database_config.outputs.ready == 'true'
        env:
          SPORTOS_FLYWAY_URL: ${{ secrets.SPORTOS_CI_UPGRADE_FLYWAY_URL }}
          SPORTOS_FLYWAY_USER: ${{ secrets.SPORTOS_CI_UPGRADE_FLYWAY_USER }}
          SPORTOS_FLYWAY_PASSWORD: ${{ secrets.SPORTOS_CI_UPGRADE_FLYWAY_PASSWORD }}
          SPORTOS_UPGRADE_DATABASE_URL: ${{ secrets.SPORTOS_CI_UPGRADE_DATABASE_URL }}
        run: |
          pnpm db:migrate -- -target=105
          psql "$SPORTOS_UPGRADE_DATABASE_URL" -v ON_ERROR_STOP=1 -f scripts/ownership-upgrade-fixture.sql
          pnpm db:migrate
          psql "$SPORTOS_UPGRADE_DATABASE_URL" -v ON_ERROR_STOP=1 -f scripts/verify-ownership-upgrade.sql

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      - name: Set up Python for offline Garmin extractor tests
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: tools/garmin/requirements.txt

      - name: Offline Garmin extractor validation
        run: |
          pnpm garmin:setup
          pnpm garmin:test

      - name: Database job and ownership integration
        if: steps.database_config.outputs.ready == 'true'
        env:
          SPORTOS_TEST_DATABASE_URL: ${{ secrets.SPORTOS_CI_LEGACY_DATABASE_URL }}
          SPORTOS_OWNER_TEST_DATABASE_URL: ${{ secrets.SPORTOS_CI_APP_DATABASE_URL }}
          SPORTOS_WORKER_TEST_DATABASE_URL: ${{ secrets.SPORTOS_CI_WORKER_DATABASE_URL }}
          SPORTOS_WORKER_DATA_TEST_DATABASE_URL: ${{ secrets.SPORTOS_CI_WORKER_DATA_DATABASE_URL }}
        run: pnpm --filter @sportos/db test:integration

      - name: Read-only athlete MCP ownership and stdio integration
        if: steps.database_config.outputs.ready == 'true'
        env:
          SPORTOS_OWNER_TEST_DATABASE_URL: ${{ secrets.SPORTOS_CI_APP_DATABASE_URL }}
        run: pnpm --filter @sportos/mcp test

      - name: API analysis ownership integration
        if: steps.database_config.outputs.ready == 'true'
        env:
          SPORTOS_OWNER_TEST_DATABASE_URL: ${{ secrets.SPORTOS_CI_APP_DATABASE_URL }}
        run: >-
          pnpm --filter @sportos/api exec vitest run
          src/analysis/analysis.integration.test.ts
          --no-file-parallelism

      - name: Worker import integration
        id: worker_import
        if: steps.database_config.outputs.ready == 'true'
        continue-on-error: true
        env:
          SPORTOS_TEST_DATABASE_URL: ${{ secrets.SPORTOS_CI_WORKER_DATABASE_URL }}
          SPORTOS_WORKER_DATA_DATABASE_URL: ${{ secrets.SPORTOS_CI_WORKER_DATA_DATABASE_URL }}
        run: >-
          pnpm --filter @sportos/worker exec vitest run
          src/import-job-runner.integration.test.ts
          --no-file-parallelism --reporter=json --outputFile=worker-import-results.json

      - name: Worker rule integration
        id: worker_rule
        if: steps.database_config.outputs.ready == 'true'
        continue-on-error: true
        env:
          SPORTOS_TEST_DATABASE_URL: ${{ secrets.SPORTOS_CI_WORKER_DATABASE_URL }}
          SPORTOS_WORKER_DATA_DATABASE_URL: ${{ secrets.SPORTOS_CI_WORKER_DATA_DATABASE_URL }}
        run: >-
          pnpm --filter @sportos/worker exec vitest run
          src/rule-change-runner.integration.test.ts
          --no-file-parallelism --reporter=json --outputFile=worker-rule-results.json

      - name: Worker provider integration
        id: worker_provider
        if: steps.database_config.outputs.ready == 'true'
        continue-on-error: true
        env:
          SPORTOS_TEST_DATABASE_URL: ${{ secrets.SPORTOS_CI_WORKER_DATABASE_URL }}
          SPORTOS_WORKER_DATA_DATABASE_URL: ${{ secrets.SPORTOS_CI_WORKER_DATA_DATABASE_URL }}
        run: >-
          pnpm --filter @sportos/worker exec vitest run
          src/provider-sync-runner.integration.test.ts
          --no-file-parallelism --reporter=json --outputFile=worker-provider-results.json

      - name: Upload worker diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: worker-integration-results
          path: apps/worker/worker-*-results.json
          if-no-files-found: warn
          retention-days: 7

      - name: Assert worker integrations
        if: always() && steps.database_config.outputs.ready == 'true'
        run: |
          test "${{ steps.worker_import.outcome }}" = "success"
          test "${{ steps.worker_rule.outcome }}" = "success"
          test "${{ steps.worker_provider.outcome }}" = "success"

      - name: Database import integration
        if: steps.database_config.outputs.ready == 'true'
        env:
          SPORTOS_TEST_DATABASE_URL: ${{ secrets.SPORTOS_CI_LEGACY_DATABASE_URL }}
          SPORTOS_OWNER_TEST_DATABASE_URL: ${{ secrets.SPORTOS_CI_APP_DATABASE_URL }}
        run: pnpm --filter @sportos/importers test:integration

      - name: Build
        run: pnpm build

  garmin-worker:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: garmin-integration-only
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.12.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Install disposable migration tools
        env:
          FLYWAY_VERSION: 10.20.1
        run: |
          curl --fail --silent --show-error --location \
            "https://repo1.maven.org/maven2/org/flywaydb/flyway-commandline/${FLYWAY_VERSION}/flyway-commandline-${FLYWAY_VERSION}-linux-x64.tar.gz" \
            --output "$RUNNER_TEMP/flyway.tar.gz"
          tar --extract --gzip --file "$RUNNER_TEMP/flyway.tar.gz" --directory "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/flyway-${FLYWAY_VERSION}" >> "$GITHUB_PATH"
      - run: pnpm --filter @sportos/worker build
      - name: Garmin fresh/upgrade migrations and isolated runtime roles
        env:
          SPORTOS_GARMIN_DISPOSABLE_ADMIN_URL: postgresql://postgres:garmin-integration-only@127.0.0.1:5432/postgres
        run: node scripts/test-garmin-worker-db.mjs

  gcp-worker-package:
    # Native release packaging and rollback tests; never authenticates to GCP.
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.12.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: pnpm install --frozen-lockfile
      - run: node --test deploy/gcp/*.test.mjs
      - run: bash deploy/gcp/package.sh "$RUNNER_TEMP/worker-artifact"
      - name: Verify offline Python install and systemd unit syntax
        run: |
          mkdir -p "$RUNNER_TEMP/worker-smoke"
          tar -xzf "$RUNNER_TEMP/worker-artifact/worker.tar.gz" -C "$RUNNER_TEMP/worker-smoke"
          python3 -m venv "$RUNNER_TEMP/worker-smoke/venv"
          "$RUNNER_TEMP/worker-smoke/venv/bin/pip" install --no-index --only-binary=:all: \
            --find-links="$RUNNER_TEMP/worker-smoke/wheels" -r tools/garmin/requirements.txt
          "$RUNNER_TEMP/worker-smoke/venv/bin/python" -c 'import garminconnect, fitdecode'
          sed "s|/opt/sportos/current|$RUNNER_TEMP/worker-smoke|g" deploy/gcp/sportos-worker.service \
            > "$RUNNER_TEMP/sportos-worker.service"
          systemd-analyze verify "$RUNNER_TEMP/sportos-worker.service"
