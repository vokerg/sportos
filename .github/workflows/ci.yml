name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CI: true
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.12.0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Start and migrate fresh test database
        run: |
          docker compose up -d postgres
          docker compose exec -T postgres sh -c 'until pg_isready -h 127.0.0.1 -U sportos -d sportos; do sleep 1; done'
          docker compose exec -T postgres createdb -h 127.0.0.1 -U sportos sportos_test
          docker compose run --rm \
            -e FLYWAY_URL=jdbc:postgresql://postgres:5432/sportos_test \
            flyway migrate

      - name: Verify populated V105 ownership upgrade
        run: |
          docker compose exec -T postgres createdb -h 127.0.0.1 -U sportos sportos_upgrade_test
          docker compose run --rm \
            -e FLYWAY_URL=jdbc:postgresql://postgres:5432/sportos_upgrade_test \
            flyway -target=105 migrate
          docker compose exec -T postgres psql -h 127.0.0.1 -U sportos -d sportos_upgrade_test < scripts/ownership-upgrade-fixture.sql
          docker compose run --rm \
            -e FLYWAY_URL=jdbc:postgresql://postgres:5432/sportos_upgrade_test \
            flyway migrate
          docker compose exec -T postgres psql -h 127.0.0.1 -U sportos -d sportos_upgrade_test < scripts/verify-ownership-upgrade.sql

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      - name: Database job and ownership integration
        env:
          SPORTOS_TEST_DATABASE_URL: postgres://sportos_legacy:sportos_legacy@localhost:5432/sportos_test
          SPORTOS_OWNER_TEST_DATABASE_URL: postgres://sportos_app:sportos_app@localhost:5432/sportos_test
        run: pnpm --filter @sportos/db test:integration

      - name: Worker job integration
        env:
          SPORTOS_TEST_DATABASE_URL: postgres://sportos_worker:sportos_worker@localhost:5432/sportos_test
          SPORTOS_WORKER_DATA_DATABASE_URL: postgres://sportos_worker_data:sportos_worker_data@localhost:5432/sportos_test
        run: pnpm --filter @sportos/worker test:integration

      - name: Database import integration
        env:
          SPORTOS_TEST_DATABASE_URL: postgres://sportos_legacy:sportos_legacy@localhost:5432/sportos_test
        run: pnpm --filter @sportos/importers test:integration

      - name: Build
        run: pnpm build

      - name: Stop test services
        if: always()
        run: docker compose down -v
