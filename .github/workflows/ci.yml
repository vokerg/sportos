name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CI: true
      SPORTOS_FLYWAY_URL: ${{ secrets.SPORTOS_CI_FLYWAY_URL }}
      SPORTOS_FLYWAY_USER: ${{ secrets.SPORTOS_CI_FLYWAY_USER }}
      SPORTOS_FLYWAY_PASSWORD: ${{ secrets.SPORTOS_CI_FLYWAY_PASSWORD }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.12.0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Neon migration tools
        env:
          FLYWAY_VERSION: 10.20.1
        run: |
          sudo apt-get update
          sudo apt-get install --yes postgresql-client
          curl --fail --silent --show-error --location \
            "https://repo1.maven.org/maven2/org/flywaydb/flyway-commandline/${FLYWAY_VERSION}/flyway-commandline-${FLYWAY_VERSION}-linux-x64.tar.gz" \
            --output "$RUNNER_TEMP/flyway.tar.gz"
          tar --extract --gzip --file "$RUNNER_TEMP/flyway.tar.gz" --directory "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/flyway-${FLYWAY_VERSION}" >> "$GITHUB_PATH"

      - name: Migrate fresh Neon test branch
        run: pnpm db:migrate

      - name: Verify populated V105 ownership upgrade
        env:
          SPORTOS_FLYWAY_URL: ${{ secrets.SPORTOS_CI_UPGRADE_FLYWAY_URL }}
          SPORTOS_FLYWAY_USER: ${{ secrets.SPORTOS_CI_UPGRADE_FLYWAY_USER }}
          SPORTOS_FLYWAY_PASSWORD: ${{ secrets.SPORTOS_CI_UPGRADE_FLYWAY_PASSWORD }}
          SPORTOS_UPGRADE_DATABASE_URL: ${{ secrets.SPORTOS_CI_UPGRADE_DATABASE_URL }}
        run: |
          pnpm db:migrate -- -target=105
          psql "$SPORTOS_UPGRADE_DATABASE_URL" -v ON_ERROR_STOP=1 -f scripts/ownership-upgrade-fixture.sql
          pnpm db:migrate
          psql "$SPORTOS_UPGRADE_DATABASE_URL" -v ON_ERROR_STOP=1 -f scripts/verify-ownership-upgrade.sql

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      - name: Database job and ownership integration
        env:
          SPORTOS_TEST_DATABASE_URL: ${{ secrets.SPORTOS_CI_LEGACY_DATABASE_URL }}
          SPORTOS_OWNER_TEST_DATABASE_URL: ${{ secrets.SPORTOS_CI_APP_DATABASE_URL }}
        run: pnpm --filter @sportos/db test:integration

      - name: API analysis ownership integration
        env:
          SPORTOS_OWNER_TEST_DATABASE_URL: ${{ secrets.SPORTOS_CI_APP_DATABASE_URL }}
        run: >-
          pnpm --filter @sportos/api exec vitest run
          src/analysis/analysis.integration.test.ts
          --no-file-parallelism

      - name: Worker import integration
        id: worker_import
        continue-on-error: true
        env:
          SPORTOS_TEST_DATABASE_URL: ${{ secrets.SPORTOS_CI_WORKER_DATABASE_URL }}
          SPORTOS_WORKER_DATA_DATABASE_URL: ${{ secrets.SPORTOS_CI_WORKER_DATA_DATABASE_URL }}
        run: >-
          pnpm --filter @sportos/worker exec vitest run
          src/import-job-runner.integration.test.ts
          --no-file-parallelism --reporter=json --outputFile=worker-import-results.json

      - name: Worker rule integration
        id: worker_rule
        continue-on-error: true
        env:
          SPORTOS_TEST_DATABASE_URL: ${{ secrets.SPORTOS_CI_WORKER_DATABASE_URL }}
          SPORTOS_WORKER_DATA_DATABASE_URL: ${{ secrets.SPORTOS_CI_WORKER_DATA_DATABASE_URL }}
        run: >-
          pnpm --filter @sportos/worker exec vitest run
          src/rule-change-runner.integration.test.ts
          --no-file-parallelism --reporter=json --outputFile=worker-rule-results.json

      - name: Worker provider integration
        id: worker_provider
        continue-on-error: true
        env:
          SPORTOS_TEST_DATABASE_URL: ${{ secrets.SPORTOS_CI_WORKER_DATABASE_URL }}
          SPORTOS_WORKER_DATA_DATABASE_URL: ${{ secrets.SPORTOS_CI_WORKER_DATA_DATABASE_URL }}
        run: >-
          pnpm --filter @sportos/worker exec vitest run
          src/provider-sync-runner.integration.test.ts
          --no-file-parallelism --reporter=json --outputFile=worker-provider-results.json

      - name: Upload worker diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: worker-integration-results
          path: apps/worker/worker-*-results.json
          if-no-files-found: warn
          retention-days: 7

      - name: Assert worker integrations
        if: always()
        run: |
          test "${{ steps.worker_import.outcome }}" = "success"
          test "${{ steps.worker_rule.outcome }}" = "success"
          test "${{ steps.worker_provider.outcome }}" = "success"

      - name: Database import integration
        env:
          SPORTOS_TEST_DATABASE_URL: ${{ secrets.SPORTOS_CI_LEGACY_DATABASE_URL }}
        run: pnpm --filter @sportos/importers test:integration

      - name: Build
        run: pnpm build
