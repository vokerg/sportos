name: GCP worker deploy after PR merge

on:
  # Target event supplies environment access even for merged fork PRs.
  # Jobs remain gated on merged=true and execute only the immutable merged SHA.
  pull_request_target:
    types: [closed]
    branches: [main]

permissions:
  contents: read

concurrency:
  group: sportos-gcp-worker-production
  cancel-in-progress: false

jobs:
  build:
    if: >-
      github.event.pull_request.merged == true &&
      github.event.pull_request.base.ref == 'main' &&
      github.event.pull_request.base.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    outputs:
      sha: ${{ steps.revision.outputs.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          # Never execute the PR head or a synthetic unmerged PR ref.
          ref: ${{ github.event.pull_request.merge_commit_sha }}
          fetch-depth: 0
      - name: Require the exact merged revision still at main
        id: revision
        env:
          MERGED_SHA: ${{ github.event.pull_request.merge_commit_sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$MERGED_SHA"
          test "$(git ls-remote origin refs/heads/main | cut -f1)" = "$MERGED_SHA"
          echo "sha=$MERGED_SHA" >> "$GITHUB_OUTPUT"
      - uses: pnpm/action-setup@v4
        with:
          version: 9.12.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: pnpm install --frozen-lockfile
      - name: Existing architecture, type and test checks
        run: |
          pnpm check:web-architecture
          pnpm test:dev-recovery
          pnpm typecheck
          pnpm test
          node --test deploy/gcp/*.test.mjs
      - name: Offline Garmin tests
        run: |
          python3 -m pip install --only-binary=:all: -r tools/garmin/requirements.txt
          python3 -m unittest discover -s tools/garmin -p 'test_*.py'
      - name: Build and package worker with production dependencies
        run: bash deploy/gcp/package.sh "$RUNNER_TEMP/worker-artifact"
      - uses: actions/upload-artifact@v4
        with:
          name: gcp-worker-${{ steps.revision.outputs.sha }}
          path: ${{ runner.temp }}/worker-artifact/worker.tar.gz*
          retention-days: 3
          if-no-files-found: error

  deploy:
    needs: build
    if: vars.GCP_WORKER_DEPLOY_ENABLED == 'true'
    environment: gcp-worker-production
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.build.outputs.sha }}
      - name: Reject a superseded release
        env:
          RELEASE_SHA: ${{ needs.build.outputs.sha }}
        run: test "$(git ls-remote origin refs/heads/main | cut -f1)" = "$RELEASE_SHA"
      - uses: actions/download-artifact@v4
        with:
          name: gcp-worker-${{ needs.build.outputs.sha }}
          path: ${{ runner.temp }}/worker-artifact
      - uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOY_SERVICE_ACCOUNT }}
      - uses: google-github-actions/setup-gcloud@v3
      - name: Transfer, activate, restart and verify
        env:
          GCP_PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
          GCP_VM_NAME: ${{ vars.GCP_VM_NAME }}
          GCP_VM_ZONE: ${{ vars.GCP_VM_ZONE }}
          GCP_SSH_KNOWN_HOSTS: ${{ secrets.GCP_SSH_KNOWN_HOSTS }}
          RELEASE_SHA: ${{ needs.build.outputs.sha }}
          ARTIFACT_DIR: ${{ runner.temp }}/worker-artifact
        run: bash deploy/gcp/ssh-operation.sh deploy
